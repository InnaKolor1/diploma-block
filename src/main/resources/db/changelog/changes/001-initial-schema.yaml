databaseChangeLog:
  - changeSet:
      id: 001-create-users-tables.yaml
      author: system
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: first_name
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: phone
                  type: VARCHAR(18)
              - column:
                  name: role
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: image
                  type: VARCHAR(255)
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-create-ads-table
      author: system
      changes:
        - createTable:
            tableName: ads
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(64)
              - column:
                  name: image
                  type: VARCHAR(255)
              - column:
                  name: author_id
                  type: INTEGER
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ads_author
                    references: users(id)
                    onDelete: CASCADE

  - changeSet:
      id: 003-create-comments-table
      author: system
      changes:
        - createTable:
            tableName: comments
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: text
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: author_id
                  type: INTEGER
                  constraints:
                    nullable: false
                    foreignKeyName: fk_comments_author
                    references: users(id)
                    onDelete: CASCADE
              - column:
                  name: ad_id
                  type: INTEGER
                  constraints:
                    nullable: false
                    foreignKeyName: fk_comments_ad
                    references: ads(id)
                    onDelete: CASCADE

  - changeSet:
      id: 004-create-indexes
      author: system
      changes:
        - createIndex:
            indexName: idx_ads_author
            tableName: ads
            columns:
              - column:
                  name: author_id
        - createIndex:
            indexName: idx_comments_ad
            tableName: comments
            columns:
              - column:
                  name: ad_id
        - createIndex:
            indexName: idx_comments_author
            tableName: comments
            columns:
              - column:
                  name: author_id