# Database
spring.application.name=diploma-block
spring.datasource.url=jdbc:postgresql://localhost:5432/diplom_bd
spring.datasource.username=diplom
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Liquibase
spring.liquibase.change-log=db/changelog/changes/001-create-notification-task-table.yaml
spring.liquibase.enabled=true

# Logging
logging.level.ru.skypro.homework=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Server
server.port=8080