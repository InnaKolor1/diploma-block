
version: '3.8'
services:
  postgres:
    image: postgres:14-alpine
    container_name: diploma-postgres
    environment:
      POSTGRES_DB: diplom_bd
      POSTGRES_USER: diplom
      POSTGRES_PASSWORD: J1234
    ports:
      - "5432:5432"
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
  backend:
    build: .
    container_name: diplom_bd
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/diplom_bd
      SPRING_DATASOURCE_USERNAME: diplom
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    restart: unless-stopped
  frontend:
    container_name: diplom
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8080
    restart: unless-stopped
volumes:
  postgres_data: