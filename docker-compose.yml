version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: ads-postgres
    platform: linux/arm64
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: diplom_bd
      POSTGRES_USER: diplom
      POSTGRES_PASSWORD: 1234
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
