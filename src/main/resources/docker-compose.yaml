postgres:
  image: postgres:14-alpine
  container_name: diploma-postgres
  environment:
    POSTGRES_DB: diplom_bd
    POSTGRES_USER: diplom
    POSTGRES_PASSWORD: "1234"
  volumes:
    - postgres_data:/var/lib/postgresql/data
  ports:
    - "5432:5432"
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U diplom"]
    interval: 10s
    timeout: 5s
    retries: 5
  networks:
    - diploma-network
